services:
  postgres:
    image: postgres:16-alpine
    container_name: bigola_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigola}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bigola_marketplace}
    ports:
      - "5432:5432"
    volumes:
      - bigola_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigola} -d ${POSTGRES_DB:-bigola_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: bigola_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - bigola_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  bigola_pgdata:
  bigola_redisdata:

